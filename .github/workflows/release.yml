name: release

# Tags are created manually (vX.Y.Z) or by the auto-release controller. Pushing
# a tag builds the native archives and publishes one immutable GitHub Release;
# archives are never overwritten. Failed releases can be retried from main
# without moving the original tag.
#
# run-name carries the release tag into the run display title so the
# auto-release controller can find the matching run for a workflow_dispatch
# retry, whose head branch (main) intentionally differs from the tag.
run-name: release ${{ inputs.tag || github.ref_name }}
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

# A tag push and a workflow_dispatch retry for the same tag must never publish
# (or recover a managed draft) concurrently. cancel-in-progress stays false so an
# in-flight publish is never aborted mid-recovery.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners only; no cross-compilation toolchain is required.
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve plugin version
        id: version
        env:
          PLUGIN_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          echo "version=$(bash scripts/plugin-version.sh)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build native plugin
        run: make build VERSION=${{ steps.version.outputs.version }}

      - name: Package archive
        env:
          # GITHUB_* variables are reserved; COMMIT identifies the checked-out tag.
          COMMIT: ${{ steps.version.outputs.commit }}
        run: >-
          bash scripts/package-plugin.sh
          "${{ steps.version.outputs.version }}"
          "${{ matrix.goos }}"
          "${{ matrix.goarch }}"
          "$RUNNER_TEMP/pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/pkg/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Least privilege: only the release job may write repository contents.
      contents: write
    steps:
      # The build ran from the exact tag; the publisher helper must come from
      # the trusted default branch so retrying an older tag never executes that
      # tag's code.
      - name: Check out trusted publisher helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: pkg
          merge-multiple: true

      - name: Assemble checksums.txt
        run: |
          cd pkg
          : > checksums.txt
          for f in ./*.zip.sha256; do
            cat "$f" >> checksums.txt
          done
          sort -k2 checksums.txt -o checksums.txt
          rm -f ./*.zip.sha256
          cat checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        run: python3 scripts/publish_release.py --tag "$TAG" --assets pkg
