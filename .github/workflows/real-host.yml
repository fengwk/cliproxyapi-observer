name: real-host

# Reusable real-host compatibility suite. Callers pass a concrete CLIProxyAPI
# release tag or "latest" for the newest stable v8 release. The plugin keeps its
# pinned SDK version; only the host binary under test is built from source.
on:
  workflow_call:
    inputs:
      cpa-tag:
        description: "CLIProxyAPI release tag, or 'latest' for the newest stable v8 release"
        required: true
        type: string

permissions:
  contents: read

jobs:
  real-host:
    # Host build plus the 300s integration suite must finish within ten minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHROME_BIN: /usr/bin/google-chrome-stable
    steps:
      - uses: actions/checkout@v7
        with:
          # The upgrade test builds the pinned v0.7.0 source without downloading
          # an unverified library or relying on a generated imitation database.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend tools
        run: npm ci --prefix web

      - name: Install Chinese fonts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match --format '%{family}\n' ':lang=zh-cn' | grep -q 'Noto.*CJK'

      - name: Verify installed Chrome
        run: |
          set -euo pipefail
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version

      - name: Resolve host tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.cpa-tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$INPUT_TAG" = "latest" ]; then
            tag="$(bash scripts/latest-cpa-release.sh)"
          else
            tag="$INPUT_TAG"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build CLIProxyAPI host from source
        env:
          # The host may require a newer Go patch than the plugin's SDK baseline.
          # Let Go select the toolchain declared by that host's go.mod, only here.
          GOTOOLCHAIN: auto
        run: bash scripts/build-cpa-host.sh "${{ steps.tag.outputs.tag }}" "$RUNNER_TEMP/cpa/cli-proxy-api"

      - name: Run real-host integration suite
        env:
          CPA_BINARY: ${{ runner.temp }}/cpa/cli-proxy-api
          CPA_TEST_ARTIFACTS: ${{ runner.temp }}/native-host-report
          OBSERVER_BROWSER: "1"
        run: make integration

      - name: Upload native host and browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-host-${{ inputs.cpa-tag }}
          path: ${{ runner.temp }}/native-host-report/
          if-no-files-found: warn
          retention-days: 14
