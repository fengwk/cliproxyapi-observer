name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend tools
        run: npm ci --prefix web

      - name: Audit frontend tools
        run: npm audit --prefix web

      - name: Frontend typecheck
        run: npm --prefix web run typecheck

      - name: Frontend tests
        run: npm --prefix web test

      - name: Verify committed frontend build
        run: |
          npm --prefix web run build
          git diff --exit-code -- internal/web/dist

      - name: Vet
        run: go vet ./...

      - name: Go tests
        run: go test ./...

      - name: Go race tests
        run: go test -race ./...

      - name: Node tests
        run: node --test internal/web/browser/mock-server.test.cjs

      - name: Automation script tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          bash scripts/test-automerge.sh
          bash scripts/test-compatibility-report.sh
          bash scripts/test-package-plugin.sh
          python3 scripts/test_dependency_policy.py
          python3 scripts/test_auto_release.py
          python3 scripts/test_publish_release.py

      - name: Makefile smoke test
        run: make help

  browser:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The ubuntu-latest image ships Google Chrome; the runner verifies it
      # before the Playwright acceptance inside the official CPA shell runs.
      CHROME_BIN: /usr/bin/google-chrome-stable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend tools
        run: npm ci --prefix web

      - name: Install Chinese fonts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match --format '%{family}\n' ':lang=zh-cn' | grep -q 'Noto.*CJK'

      - name: Verify installed Chrome
        run: |
          set -euo pipefail
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version

      - name: Browser acceptance
        env:
          BROWSER_REPORT_DIR: ${{ runner.temp }}/browser-report
        run: make browser

      - name: Upload browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-acceptance
          path: |
            ${{ runner.temp }}/browser-report/report.json
            ${{ runner.temp }}/browser-report/summary.txt
            ${{ runner.temp }}/browser-report/screenshots/
          if-no-files-found: warn
          retention-days: 14

  native:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners only; no cross-compilation toolchain is required.
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build native plugin
        run: make build

      - name: Store native artifact from main
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.goos }}/${{ matrix.goarch }}/
          if-no-files-found: error
          retention-days: 14

  real-host:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # v0.7.0 requires schema >= 6 and is validated against the SDK baseline
        # host plus the newest stable release instead of the retired v8.0.15.
        cpa-tag: ["v8.0.30", "latest"]
    uses: ./.github/workflows/real-host.yml
    with:
      cpa-tag: ${{ matrix.cpa-tag }}
