# 将片段合入现有 CPA >=v8.0.30（schema 6）配置，不要覆盖现有配置。
# 管理登录使用宿主已有管理密钥；不要在示例或仓库中放真实凭据。
plugins:
  enabled: true
  dir: "./plugins"
  store-sources:
    - "https://raw.githubusercontent.com/fengwk/cliproxyapi-observer/main/registry.json"
  configs:
    cliproxyapi-observer:
      enabled: true
      # 相对路径以 CPA 工作目录解析。必须使用新库，不迁移或删除旧数据库。
      db: "data/cliproxyapi-observer-v2.db"
# 首次启动后：管理面板 Observer -> 管理密钥登录 -> Key 管理 -> 创建新客户端 Key。
# 采集/保留期/定价由插件设置页管理，不是宿主 YAML 字段。
# 独占客户端认证：CPA 内置 Key 不能复用。请勿在繁忙时热更新插件。
