<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Observer · Key 与用量</title>
    <link rel="stylesheet" href="/v0/resource/plugins/cliproxyapi-observer/ui.css" />
  </head>
  <body>
    <header>
      <div><strong>Observer</strong><span>Key 与用量管理</span></div>
      <div id="tools"></div>
    </header>
    <main>
      <form id="login">
        <h1>管理登录</h1>
        <p>使用同源 CPA 管理密钥；仅保存在本次标签页会话。</p>
        <label
          >管理密钥<input type="password" autocomplete="off" required /></label
        ><button>登录</button>
      </form>
      <nav aria-label="页面" hidden></nav>
      <p id="message" role="status" aria-live="polite"></p>
      <div id="content"></div>
    </main>
    <script src="/v0/resource/plugins/cliproxyapi-observer/ui.js"></script>
  </body>
</html>
